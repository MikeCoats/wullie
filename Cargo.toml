[package]
name = "wullie"
version = "0.1.2"
authors = ["Mike Coats <i.am@mikecoats.com>"]
edition = "2024"
rust-version = "1.88"
description = "A local project dependency and update finder"
homepage = "https://wullie.mikecoats.xyz"
repository = "https://github.com/MikeCoats/wullie"
license = "GPL-3.0-or-later"
keywords = ["command-line", "task", "development", "utility"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**", "/LICENSES/**", "/README.md", "/Cargo.lock"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "=4.6.8", features = ["derive"] }
ignore = "0.4.34"
indexmap = { version = "2.14.2", features = ["serde"] }
nodejs-semver = "7.0.0"
pep440_rs = "0.7.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
strum = { version = "0.28.0", features = ["derive"] }
ureq = "3.5.2"
toml_edit = "0.25.19"
thiserror = "2.0.21"
etcetera = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
