[package]
name = "wullie"
version = "0.1.0"
description = "A local project dependency and update finder"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
