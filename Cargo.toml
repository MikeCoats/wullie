[package]
name = "wullie"
version = "0.1.0"
description = "A local project dependency and update finder"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
clap = { version = "=4.6.8", features = ["derive"] }
ignore = "0.4.34"
pep440_rs = "0.7.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
strum = { version = "0.28.0", features = ["derive"] }
ureq = "3.5.2"
toml_edit = "0.25.19"
thiserror = "2.0.21"
etcetera = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
