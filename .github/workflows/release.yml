name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG != v$version"; exit 1; }
      - name: Check the crate packages for crates.io
        run: cargo publish --dry-run
      - run: gh release create "$TAG" --draft --verify-tag --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@just
      - run: just dist ${{ matrix.target }}
        env:
          TAR: ${{ runner.os == 'macOS' && 'gtar' || 'tar' }}
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
