name: Release

on:
  push:
    tags: ["v*"]

# Actions are pinned to full commit SHAs, with their version in a comment, so
# a moved or compromised tag can't change what runs. Tools are pinned to exact
# versions for the same reason, and so CI only changes when we choose. Runners
# are named by OS version rather than `-latest` for that reason too.

# Building code & dependencies from cargo can result in code execution, so we
# should be careful about what we compile and where we do it. We default to
# read-only permissions for all jobs. We then elevate permissions ONLY for
# steps that ONLY interact with GitHub.
permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(cargo pkgid | sed 's/.*[#@]//')
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG != v$version"; exit 1; }
      - name: Check the crate packages and builds for crates.io
        run: cargo publish --dry-run

  create:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Extract the tag message
        run: git tag --list "$TAG" --format='%(contents:subject)%0a%0a%(contents:body)' > "$RUNNER_TEMP/notes.md"
      - run: gh release create "$TAG" --draft --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-apple-darwin,      os: macos-15 }
          - { target: x86_64-apple-darwin,       os: macos-15 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2025 }
    runs-on: ${{ matrix.os }}
    # Builds take about 3 minutes, so a stuck one fails rather than holding
    # up the release for GitHub's default of 6 hours. This is more common on
    # the Apple builds due to GH's restricted amount of runners.
    timeout-minutes: 15
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just@1.59.0
      - name: Install a musl C compiler for ring
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - run: just tarball ${{ matrix.target }}
        shell: bash
        env:
          TAR: ${{ runner.os == 'macOS' && 'gtar' || 'tar' }}
      - name: Install lintian to check the Debian package
        if: endsWith(matrix.target, '-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install --yes lintian
      - if: endsWith(matrix.target, '-linux-gnu')
        run: just deb ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.deb dist/*.sha256 --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: upload
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # We follow a similar security principle here, too. The check job has
      # already built this code with `cargo publish --dry-run`. Running publish
      # with no-verify means we don't run any checks thereby preventing
      # supply-chain code execution from getting near our crates.io token.
      - run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
